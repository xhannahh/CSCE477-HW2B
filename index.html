<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
</head>
<body>
  <h1>Login</h1>
  <form id="login-form">
    <label for="email">Email</label>
    <input type="text" id="email" name="email" />

    <label for="password">Password</label>
    <input type="password" id="password" name="password" />

    <button type="submit">Log in</button>
  </form>
  <p id="message"></p>

  <script src="script.js"></script>
</body>
</html>
